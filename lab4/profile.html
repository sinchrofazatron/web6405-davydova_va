<!DOCTYPE html>
<html lang="ru" dir="ltr">

<head>
    <link href="style.css" rel="stylesheet">
    <meta charset="UTF-8">
    <meta name="keywords" content="социальная сеть, профиль, О2">
    <meta name="description" content="Профиль пользователя в социальной сети О2.">
    <title>O2: Профиль</title>
</head>

<body>
    <aside class="aside-panel">
        <img src="images/logo-no-bg-preview.png" class="aside-panel-logo" alt="Логотип О2">
        <nav class="aside-panel-nav">
            <a href="profile.html" class="aside-panel-link">
                <span>Профиль</span>
            </a>
            <a href="main_screen.html" class="aside-panel-link">
                <span>Лента</span>
            </a>
            <a href="messages.html" class="aside-panel-link">
                <span>Сообщения</span>
            </a>
            <a href="friends.html" class="aside-panel-link">
                <span>Друзья</span>
            </a>
        </nav>
    </aside>

    <main class="main-content">

        <header class="main-content-header">
            <h1>Профиль</h1>
        </header>

        <section class="profile-card">
            <div class="profile-card__avatar-col">
                <div class="profile-card__avatar">
                    <img src="images/avatar_mihail-bulgakov.jpg" alt="Мой аватар" class="profile-card__avatar-img">
                </div>
                <div class="profile-card__avatar-actions">
                    <button type="button" class="profile-card__icon-btn" title="Изменить фото">Изменить фото</button>
                    <button type="button" class="profile-card__icon-btn" title="Удалить фото">Удалить фото</button>
                </div>
            </div>

            <div class="profile-card__form-col">
                <form class="profile-form">
                    <div class="profile-form__field">
                        <label for="name">Имя</label>
                        <input type="text" id="name" placeholder="Михаил Булгаков" value="Михаил Булгаков">
                    </div>

                    <div class="profile-form__field">
                        <label for="bio">О себе</label>
                        <textarea id="bio" name="bio" rows="3" placeholder="Расскажи о себе">Злых людей нет на свете, есть люди несчастливые</textarea>
                    </div>

                    <div class="profile-form__field">
                        <label for="email">Почта</label>
                        <input type="email" id="email" name="email" placeholder="example@gmail.com" value="mab@gmail.com">
                    </div>

                    <div class="profile-form__actions">
                        <button type="submit" class="profile-form__save">Сохранить</button>
                    </div>

                </form>

            </div>            
        </section>
    </main>
</body>
</html>
