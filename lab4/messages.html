<!DOCTYPE html>
<html lang="ru" dir="ltr">

<head>
    <link href="style.css" rel="stylesheet">
    <meta charset="UTF-8">
    <meta name="keywords" content="социальная сеть, сообщения, мессенджер, О2">
    <meta name="description" content="Сообщения для социальной сети О2. Общайтесь с друзьями и получайте уведомления о новых сообщениях.">
    <title>O2: Сообщения</title>
</head>

<body>
    <aside class="aside-panel">
        <img src="images/logo-no-bg-preview.png" class="aside-panel-logo" alt="Логотип О2">
        <nav class="aside-panel-nav">
            <a href="profile.html" class="aside-panel-link">
                <span>Профиль</span>
            </a>
            <a href="main_screen.html" class="aside-panel-link">
                <span>Лента</span>
            </a>
            <a href="messages.html" class="aside-panel-link">
                <span>Сообщения</span>
            </a>
            <a href="friends.html" class="aside-panel-link">
                <span>Друзья</span>
            </a>
        </nav>
    </aside>

    <main class="main-content">

        <header class="main-content-header">
            <h1>Сообщения</h1>
        </header>

        <section class="chats">

            <a href="chat.html?userId=1" class="chats__item">
                <img src="images/avatar1.jpg" class="chats__avatar" alt="Аватар Sad Cat">
                <div class="chats__info">
                    <span class="chats__name">Sad Cat</span>                   
                    <span class="chats__preview">Да норм, че. Наловил я кароч мышов. У тя че как?</span>
                </div>
                <span class="chats__time">5-10 минут пятого, 4-5</span>
            </a>

            <a href="chat.html?userId=2" class="chats__item">
                <img src="images/avatar2.jpg" class="chats__avatar" alt="Аватар Sad Cat">
                <div class="chats__info">
                    <span class="chats__name">Happy Dog</span>                   
                    <span class="chats__preview">Хозяин не разрешил сгрызть его тапки</span>
                </div>
                <span class="chats__time">12:34</span>
            </a>

            <a href="chat.html?userId=3" class="chats__item">
                <img src="images/avatar3.jpg" class="chats__avatar" alt="Аватар Pink Pig">
                <div class="chats__info">
                    <span class="chats__name">Pink Pig</span>                   
                    <span class="chats__preview">Целый день валялся в грязи</span>
                </div>
                <span class="chats__time">21:54</span>
            </a>
        </section>
    </main>
</body>
</html>
