<!DOCTYPE html>
<html lang="ru">
<head>
    <link href="style.css" rel="stylesheet">
    <meta charset="UTF-8">
    <meta name="keywords" content="социальная сеть, друзья, O2">
    <meta name="description" content="Страница друзей в социальной сети O2.">
    <title>O2: Друзья</title>
</head>
<body>

    <aside class="aside-panel">
        <img src="images/logo-no-bg-preview.png" class="aside-panel-logo" alt="Логотип O2">
        <nav class="aside-panel-nav">
            <a href="profile.html" class="aside-panel-link">Профиль</a>
            <a href="main_screen.html" class="aside-panel-link">Лента</a>
            <a href="messages.html" class="aside-panel-link">Сообщения</a>
            <a href="friends.html" class="aside-panel-link active">Друзья</a>
        </nav>
    </aside>

    <main class="main-content">

        <header class="main-content-header">
            <h1>Друзья</h1>
        </header>

        <table class="friends-table">
            <thead>
                <tr>
                    <th class="name-col">Имя</th>
                    <th class="status-col">Статус</th>
                    <th class="city-col">Город</th>
                    <th class="action-col">Действие</th>
                </tr>
            </thead>
            <tbody>
                <tr>
                    <td class="name-col">
                        <img src="images/avatar1.jpg" class="avatar" alt="Аватар Sad Cat">
                        <span class="post-author-name">Sad Cat</span>
                    </td>
                    <td class="status-col">В сети</td>
                    <td class="city-col">Москва</td>
                    <td class="action-col"><a href="messages.html">Написать</a></td>
                </tr>
                <tr>
                    <td class="name-col">
                        <img src="images/avatar2.jpg" class="avatar" alt="Аватар Happy Dog">
                        <span class="post-author-name">Happy Dog</span>
                    </td>
                    <td class="status-col">В сети</td>
                    <td class="city-col">Сиэтл</td>
                    <td class="action-col"><a href="messages.html">Написать</a></td>
                </tr>
                <tr>
                    <td class="name-col">
                        <img src="images/avatar3.jpg" class="avatar" alt="Аватар Pink Pig">
                        <span class="post-author-name">Pink Pig</span>
                    </td>
                    <td class="status-col">Не в сети</td>
                    <td class="city-col">Лос-Анджелес</td>
                    <td class="action-col"><a href="messages.html">Написать</a></td>
                </tr>
            </tbody>
        </table>

    </main>

</body>
</html>
