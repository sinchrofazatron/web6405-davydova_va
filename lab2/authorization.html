<!DOCTYPE html>
<html lang="ru">
<head>
    <link href="style.css" rel="stylesheet">
    <meta charset="UTF-8">
    <meta name="keywords" content="социальная сеть, регистрация, вход, О2">
    <meta name="description" content="вход, авторизация, O2">
    <title>O2: регистрация</title>
</head>
<body class="registration-main">
     
        <!-- <img src="images/logo-no-bg-preview.png" class="logo">
        <img src="images/wave_left.png" class="wave_left"> -->
      
    <main>
        <div>
            <img src="images/logo-no-bg-preview.png" class="logo" alt="Логотип О2">
        </div>

        <div>
            <h1>Войти в аккаунт</h1>
            <form>
                <div class="input">
                    <label for="username">Имя пользователя</label>
                    <input type="text" id="username" placeholder="Михаил Булгаков" required>
                </div>
               
                <div class="input">
                    <label for="password">Пароль</label>
                    <input type="password" id="password" placeholder="123456" required>
                </div>
                
                <button class="btn">
                    <a href="main_screen.html" class="reg-a">Войти</a>
                </button>

                <div class="auth-switch"> 
                    <a href="registration.html">Зарегистрироваться</a>
                </div>

            </form>

            
        </div>
    </main>
</body>
</html>
