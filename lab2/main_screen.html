<!DOCTYPE html>
<html lang="ru" dir="ltr">

<head>
    <link href="style.css" rel="stylesheet">
    <meta charset="UTF-8">
    <meta name="keywords" content="социальная сеть, посты, новости, О2">
    <meta name="description" content="Лента новостей для социальной сети О2. Делитесь своими новостями, а также следите за новостями других людей.">
    <title>O2: Лента новостей</title>
</head>

<body>
    <aside class="aside-panel">
        <img src="images/logo-no-bg-preview.png" class="aside-panel-logo" alt="Логотип О2">
        <nav class="aside-panel-nav">
            <a href="profile.html" class="aside-panel-link">
                <span>Профиль</span>
            </a>
            <a href="main_screen.html" class="aside-panel-link">
                <span>Лента</span>
            </a>
            <a href="messages.html" class="aside-panel-link">
                <span>Сообщения</span>
            </a>
            <a href="friends.html" class="aside-panel-link">
                <span>Друзья</span>
            </a>
        </nav>
    </aside>

    <main class="main-content">

        <header class="main-content-header">
            <h1>Лента новостей</h1>
        </header>

        <section class="posts">

            <article class="post">
                <div class="post-author">
                    <img src="images/avatar1.jpg" class="avatar" alt="Аватар Sad Cat">
                    <span class="post-author-name">Sad Cat</span>
                </div>
                <div>
                    <p class="post-content">Потыгыдыкал</p>
                </div>
            </article>

            <article class="post">
                <div class="post-author">
                    <img src="images/avatar2.jpg" class="avatar" alt="Аватар Happy Dog">
                    <span class="post-author-name">Happy Dog</span>
                </div>
                <div>
                    <p class="post-content">Погулял!</p>
                </div>
            </article>

            <article class="post">
                <div class="post-author">
                    <img src="images/avatar3.jpg" class="avatar" alt="Аватар Pink Pig">
                    <span class="post-author-name">Pink Pig</span>
                </div>
                <div>
                    <p class="post-content">Похрюкал</p>
                </div>
            </article>

            <article class="post">
                <div class="post-author">
                    <img src="images/avatar2.jpg" class="avatar" alt="Аватар Happy Dog">
                    <span class="post-author-name">Happy Dog</span>
                </div>
                <div>
                    <p class="post-content">Поспал</p>
                </div>
            </article>

        </section>

        <section class="create-post">
            <img src="images/avatar.jpg" class="avatar" alt="Мой аватар">
            <input type="text" placeholder="Что нового?" class="create-post-input">
            <button class="create-post-btn">Опубликовать</button>
        </section>
    </main>
</body>
</html>
